<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
    
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }
        #terminal {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .xterm {
            height: 100%;
        }
    </style>
</head>
<!--
for compiling xterm-pty in wasmsrc

emcc -l idbfs.js -s FORCE_FILESYSTEM=1 -s ASYNCIFY -s EXPORTED_RUNTIME_METHODS='["FS","addRunDependency","removeRunDependency"]' -s EXPORTED_FUNCTIONS='["_main"]' --js-library=../../../node_modules/xterm-pty/emscripten-pty.js -o hello.js hello.c
-->
<body>
    <div id="terminal"></div>
    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/xterm-pty/index.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
    <script src="term.js"></script>
    <script>
        loadPyodide({ emscriptenSettings: Module });
    </script>
</body>
</html>
