<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Red Hat Text", system-ui, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-image: url(https://picsum.photos/2880/1800);
            background-size: cover;
            backdrop-filter: blur(100px);
        }

        #tablist {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px;
            flex: 0;
        }

        #tab {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            display: inline-flex;
            white-space: nowrap;
            padding: 5px;
            width: 20ch;
            color: white;
            gap: 10px;
        }
        #tab > img {
            display: inline-flex;
            align-self: center;
            margin: auto;
            float: right;
            margin-right: 0;
        }

        #tabname {
            display: inline-flex;
            align-self: center;
            margin: auto;
            text-shadow: 0px 0px 1px black;
            float: left;
            margin-left: 0;
            overflow: hidden;
        }
        
        #browser-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        
        #frame {
            flex: 1;
            height: 100%;
            width: 100%;
            border: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #frame > iframe {
            width: 100%;
            height: 100%;
            border: 0;
            padding: 0;
            margin: 0;
            opacity: 90%;
        }

        #urlinput {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 5px;
        }
        #url {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
        }

        
    </style>
</head>
<body>
    <div id="browser-container">
        <div id="urlinput">
            <input type="text" id="url" placeholder="Go to a URL">
        </div>
        <div id="frame">
            <iframe src="http://google.com/webhp?igu=1" frameborder="0"></iframe>
        </div>
    </div>
    <script>
        const iframe = document.querySelector("iframe");
        const urlinput = document.querySelector("#url");
        iframe.addEventListener("load", () => {
            try {
                urlinput.value = iframe.contentWindow.location.href;
            } catch {
                urlinput.value = iframe.getAttribute("src") || iframe.src;
                console.log("cross origin policies block URL updates");
            }
        });
        urlinput.addEventListener("keydown", (e) => {
            if (e.key === 'Enter') {
                iframe.src = urlinput.value;
            }
        })
    </script>
</body>
</html>
