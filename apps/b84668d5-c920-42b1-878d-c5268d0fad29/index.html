<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About This Wallpaper</title>
    <style>
        * {
            font-family: sans-serif;
            text-decoration: none;
        }
        html,body{
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        body {
            color: black;
            background: white;
            display: flex;
            justify-items: center;
            align-items: center;
            text-align: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        a {
            color: navy;
        }

        #container {
            background: rgba(255, 255, 255, 0.8);
            padding: 12px;
            border-radius: 10px;
            margin: auto;
        }
    </style>
</head>
<body>
    <div id="container">

    <p>
        Hello! If you are here, you might be wondering "Where do these wallpapers come from?!".<br>
        We actually use <a href="http://picsum.photos" target="_blank">picsum.photos</a>, a service that provides random images in a desired resolution.<br>
        It's the "Lorem Ipsum" of images. See it in action!
    </p>
    
    </div>

    <script>
        function rng(max) {
            return Math.ceil(Math.random() * max)
        }
        const body = document.body;
        body.style.backgroundImage = `url(https://picsum.photos/2880/1880?salt=${rng(1024).toString()})`;

    </script>
</body>
</html>
