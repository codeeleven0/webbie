<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refresh Wallpaper</title>
    <style>
        body, html {
            background: black;
            color: white;
        }
    </style>
</head>
<body>
    <script>
        const uuid = new URLSearchParams(window.location.search).get("uuid");
        function rng(max) {
            return Math.ceil(Math.random() * max)
        }
        const desktop = parent.document.querySelector("#desktop-ui");

        // my code from tabsandtabs adapted to here
        function picsum() {
            let url = `https://picsum.photos/${parent.window.outerWidth}/${parent.window.outerHeight}?salt=${rng(1024).toString()}`;
            let promise = new Promise((resolve, reject) => {
                desktop.classList.remove("focus");
                const img = new Image();
                img.src = url;
                img.onload = () => {
                    desktop.classList.add("focus");
                    parent.document.body.style.backgroundImage = `url(${img.currentSrc || img.src})`;
                    resolve(img);
                };
                img.onerror = (err) => { reject(err); };
            });
            return promise;
        }
        async function doAll() {
            await picsum();
            setTimeout(_ => parent.window.instances[uuid].close(true), 0);
        }
        parent.window.instances[uuid].minimize();
        doAll();
    </script>
</body>
</html>
