<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <script src="../../node_modules/vanilla-calendar-pro/index.js"></script>
    <link rel="stylesheet" href="../../node_modules/vanilla-calendar-pro/styles/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Red Hat Text", system-ui, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #calendar {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border-radius: 0 !important;
        }
    </style>
</head>
<body>
    <div id="calendar"></div>
    <script>
        var cal = new VanillaCalendarPro.Calendar("#calendar");
        cal.init();
    </script>
</body>
</html>
