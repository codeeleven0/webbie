<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackBlitz</title>
    <script src="../../node_modules/@stackblitz/sdk/bundles/sdk.umd.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #editor-container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="editor-container"></div>
    <script>
        StackBlitzSDK.embedProject(
            'editor-container',
            {
              title: 'StackBlitz',
              description: 'StackBlitz Project',
              template: 'javascript',
              files: {
                'index.js': 'console.log("Hello from StackBlitz!");',
                'index.html': '<h1>Welcome to StackBlitz!</h1>'
              }
            },
            {
              openFile: 'index.js',
              view: 'both'
            }
        );      
    </script>
</body>
</html>
