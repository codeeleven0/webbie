<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webbie</title>
    <script src="node_modules/winbox/dist/winbox.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: "Red Hat Text", system-ui, sans-serif;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        #desktop-ui {
            height: 100%;
            margin: 0;
            padding: 0;
            background: white;
        }

        #desktop-ui > #taskbar {
            font-size: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(1.3px);
            height: 48px;
            align-items: center;
            display: flex;
            bottom: 0;
            position: absolute;
            width: 100%;
            border-top: 1px solid rgba(0, 0, 0, 0.3);
        }

        #desktop-ui > #taskbar > #taskbar-view {
            color: white;
            width: 100%;
            display: flex;
        }

        #desktop-ui > #taskbar > #taskbar-view > #clock {
            flex-shrink: 0;
            align-items: center;
            padding: 10px;
            margin: auto;
        }

        #desktop-ui > #taskbar > #taskbar-view > #tasks {
            display: inline-block;
            align-self: center;
            justify-self: center;
        }

        #desktop-ui > #deskview {
            background-image: url(https://picsum.photos/2880/1800);
            background-size: cover;
            height: 100%;
            padding: 0;
        }

        #desktop-ui > #deskview > #desk-elements {
            padding: 10px;
            display: flex;
            
        }

        #desktop-ui > #deskview > #desk-elements > .desktop-entry > .app-logo > img {
            width: 32px;
            height: 32px;
            color: white;
        }

        #desktop-ui > #deskview > #desk-elements > .desktop-entry > .app-logo {
            background: rgba(0, 0, 0, 0.3);
            display: inline-flex;
            padding: 6px;
            border-radius: 16px;
        }

        #desktop-ui > #deskview > #desk-elements > .desktop-entry > .app-name {
            width: 64px;
            font-size: 12px;
            color: white;
            text-shadow: 0px 0px 2px black;
        }

        #desktop-ui > #deskview > #desk-elements > .desktop-entry {
            display: inline-block;
            align-items: center;
            text-align: center;
            padding: 5px;
            border-radius: 10px;
            cursor: pointer;
        }

        #desktop-ui > #deskview > #desk-elements > .desktop-entry:hover {
            background: rgba(255, 255, 255, 0.2);
        }


        #desktop-ui > #taskbar > #taskbar-view > #tasks {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #desktop-ui > #taskbar > #taskbar-view > #tasks > .task-entry {
            display: inline-block;
            cursor: pointer;
        }

        #desktop-ui > #taskbar > #taskbar-view > #tasks > .task-entry > .app-logo {
            display: flex;
            padding: 6px;
            white-space: nowrap; 
        }

        #desktop-ui > #taskbar > #taskbar-view > #tasks > .task-entry > .app-name {
            font-size: 12px;
        }

        #desktop-ui > #taskbar > #taskbar-view > #tasks > .task-entry > .app-logo > img {
            width: 32px;
            height: 32px;
            color: white;
        }

        .winbox {
            border-radius: 6px;
            backdrop-filter: blur(1.3px);
            color: white;
            text-shadow: 0px 0px 1px black;
            background: rgba(0, 0, 0, 0.4);
        }

        .wb-title {
            font-family: "Red Hat Text", system-ui, sans-serif;
        }

        .winbox.max {
            border-radius: 0;
            background: black !important;
        }
    </style>
</head>
<body>
    <div id="desktop-ui">
        <div id="deskview">
            <div id="desk-elements">

            </div>
        </div>
        <div id="taskbar">
            <div id="taskbar-view">
                <div id="tasks">
                    
                </div>
                <div id="clock">
                    &nbsp;
                </div>
            </div>
        </div>
    </div>

    <script>
        const desktopClock = document.querySelector("#taskbar > #taskbar-view > #clock");
        const desktop = document.querySelector("#desktop-ui > #deskview");
        const tasks = document.querySelector("#desktop-ui > #taskbar > #taskbar-view > #tasks");

        const apps = {
            "@wallpaperinfo": {
                uuid: "b84668d5-c920-42b1-878d-c5268d0fad29",
                name: "About This Wallpaper",
                icon: "aperture-svgrepo-com.svg"
            },
            "@apps" : {
                uuid: "8eae4817-8702-4409-aec2-c69e5c5d7683",
                name: "Launchpad",
                icon: "apps-alt-svgrepo-com.svg"
            }
        };

        setInterval(() => {
            let date = new Date();
            desktopClock.innerText = `${date.getHours().toString().padStart(2, "0")}:${date.getMinutes().toString().padStart(2, "0")}`;
        }, 1000);

        function newWindow(wn, url, uuid) {
            return new WinBox(wn, {
                class: ["no-full", `instance-${uuid}`],
                root: desktop,
                bottom: 48,
                url: url,
                hidden: true
            });
        }
        function openApp(app) {
            let instanceUUID = crypto.randomUUID().toString();

            let tbent = document.createElement("div");
            tbent.classList.add("task-entry");
            tbent.classList.add(`instance-${instanceUUID}`);
            let app_logo = document.createElement("div");
            app_logo.classList.add("app-logo");
            let app_img = document.createElement("img");
            app_img.src = `apps/${app.uuid}/${app.icon}`;
            app_logo.appendChild(app_img);
            tbent.appendChild(app_logo);

            let win = undefined;
            if (app.url == undefined) {
                win = newWindow(app.name, `apps/${app.uuid}/index.html?uuid=${instanceUUID}`, instanceUUID);
            } else {
                win = newWindow(app.name, app.url, instanceUUID);
            }
            win.icon = app_img.src;
            win.onminimize = () => {
                win.hidden = true;
                win.addClass("hide");
                tbent.style.opacity = "50%";
            };
            tbent.addEventListener("click", () => {
                if (win.hidden) {
                    win.restore();
                    win.hidden = false;
                    win.removeClass("hide");
                    tbent.style.opacity = "100%";
                } else {
                    win.minimize();
                    
                }
            });

            win.removeClass("hide");
            win.hidden = false;

            win.onclose = (e) => {
                tbent.remove();
            };
            tasks.appendChild(tbent);
        }
        function newDesktopEntry(app) {
            let desktop_entry = document.createElement("div");
            desktop_entry.classList.add("desktop-entry");
            let app_logo = document.createElement("div");
            app_logo.classList.add("app-logo");
            let app_name = document.createElement("div");
            app_name.classList.add("app-name");
            let app_img = document.createElement("img");
            app_logo.appendChild(app_img);
            desktop_entry.appendChild(app_logo);
            desktop_entry.appendChild(app_name);
            app_name.innerText = app.name;
            app_img.src = `apps/${app.uuid}/${app.icon}`;
            desktop_entry.addEventListener("click", () => {
                openApp(app);
            });
            desktop.querySelector("#desk-elements").appendChild(desktop_entry);
        }

        Object.keys(apps).forEach(key => {
            newDesktopEntry(apps[key]);
        });
        
    </script>
</body>
</html>
