<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webbie</title>
    <script src="node_modules/winbox/dist/winbox.bundle.min.js"></script>
    <style>
        * {
            font-family: sans-serif;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        #desktop-ui {
            height: 100%;
            margin: 0;
            padding: 0;
            background: white;
        }

        #desktop-ui > #taskbar {
            font-size: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(1.3px);
            height: 48px;
            align-items: center;
            display: flex;
            bottom: 0;
            position: absolute;
            width: 100%;
            border-top: 1px solid rgba(0, 0, 0, 0.3);
        }

        #desktop-ui > #taskbar > #taskbar-view {
            color: white;
            width: 100%;
            display: flex;
        }

        #desktop-ui > #taskbar > #taskbar-view > #clock {
            flex-shrink: 0;
            align-items: center;
            padding: 10px;
            margin: auto;
        }

        #desktop-ui > #taskbar > #taskbar-view > #tasks {
            display: inline-block;
            align-self: center;
            justify-self: center;
        }

        #desktop-ui > #deskview {
            background-image: url(https://picsum.photos/2880/1800);
            background-size: cover;
            height: 100%;
            padding: 0;
        }

        #desktop-ui > #deskview > #desk-elements {
            padding: 10px;
        }

        #desktop-ui > #deskview > #desk-elements > .desktop-entry > .app-logo > img {
            width: 32px;
            height: 32px;
            color: white;
        }

        #desktop-ui > #deskview > #desk-elements > .desktop-entry > .app-logo {
            background: rgba(0, 0, 0, 0.3);
            display: inline-flex;
            padding: 6px;
            border-radius: 16px;
        }

        #desktop-ui > #deskview > #desk-elements > .desktop-entry > .app-name {
            width: 64px;
            font-size: 12px;
            color: white;
            text-shadow: 0px 0px 1px black;
        }

        #desktop-ui > #deskview > #desk-elements > .desktop-entry {
            display: inline-block;
            align-items: center;
            text-align: center;
            padding: 5px;
            border-radius: 10px;
            cursor: pointer;
        }

        #desktop-ui > #deskview > #desk-elements > .desktop-entry:hover {
            background: rgba(255, 255, 255, 0.2);
        }


        #desktop-ui > #taskbar > #taskbar-view > #tasks {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #desktop-ui > #taskbar > #taskbar-view > #tasks > .task-entry {
            display: inline-block;
            cursor: pointer;
        }

        #desktop-ui > #taskbar > #taskbar-view > #tasks > .task-entry > .app-logo {
            display: flex;
            padding: 6px;
            white-space: nowrap; 
        }

        #desktop-ui > #taskbar > #taskbar-view > #tasks > .task-entry > .app-name {
            font-size: 12px;
        }

        #desktop-ui > #taskbar > #taskbar-view > #tasks > .task-entry > .app-logo > img {
            width: 32px;
            height: 32px;
            color: white;
        }

        .winbox {
            border-radius: 6px;
            backdrop-filter: blur(1.3px);
            color: white;
            text-shadow: 0px 0px 1px black;
            background: rgba(0, 0, 0, 0.4);
        }

        .winbox.max {
            border-radius: 0;
            background: black !important;
        }
    </style>
</head>
<body>
    <div id="desktop-ui">
        <div id="deskview">
            <div id="desk-elements">
                <div class="desktop-entry">
                    <div class="app-logo">
                        <img src="assets/aperture-svgrepo-com.svg" alt="" srcset="">
                    </div>
                    <div class="app-name">About This Wallpaper</div>
                </div>
            </div>
        </div>
        <div id="taskbar">
            <div id="taskbar-view">
                <div id="tasks">
                    <div class="task-entry">
                        <div class="app-logo">
                            <img src="assets/apps-alt-svgrepo-com.svg" alt="" srcset="">
                        </div>
                    </div>
                </div>
                <div id="clock">
                    xx:xx
                </div>
            </div>
        </div>
    </div>

    <script>
        const desktopClock = document.querySelector("#taskbar > #taskbar-view > #clock");
        const desktop = document.querySelector("#desktop-ui > #deskview");
        setInterval(() => {
            let date = new Date();
            desktopClock.innerText = `${date.getHours().toString().padStart(2, "0")}:${date.getMinutes().toString().padStart(2, "0")}`;
        }, 1000);

        function newWindow() {
            new WinBox("window", {
                class: ["no-full"],
                root: desktop,
                bottom: 48,
            });
        }

        newWindow();
    </script>
</body>
</html>
